[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "trae2codex"
version = "0.1.0"
description = "Local, auditable TRAE to Codex session migration"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
keywords = ["trae", "codex", "migration", "chat-history"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
trae2codex = "trae2codex.cli:main"

[tool.setuptools.packages.find]
include = ["trae2codex*"]
