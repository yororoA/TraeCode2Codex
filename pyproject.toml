[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "trae2codex"
version = "0.1.0"
description = "Local, auditable TRAE to Codex session migration"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["trae", "codex", "migration", "chat-history"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/yororoA/TraeCode2Codex"
Repository = "https://github.com/yororoA/TraeCode2Codex"
Issues = "https://github.com/yororoA/TraeCode2Codex/issues"
Releases = "https://github.com/yororoA/TraeCode2Codex/releases"

[project.scripts]
trae2codex = "trae2codex.cli:main"

[tool.setuptools.packages.find]
include = ["trae2codex*"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "PLW1510", "TRY004"]
