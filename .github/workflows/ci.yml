name: Test and Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m pip install ruff==0.16.7
      - run: ruff check trae2codex tests
      - run: ruff format --check trae2codex tests
      - run: python -m pip install .
      - run: trae2codex --help

  codex-integration:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: npm install --prefix .local/codex --ignore-scripts @openai/codex@0.154.0
      - name: Offline real-Codex tests
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            export TRAE2CODEX_TEST_CODEX="$GITHUB_WORKSPACE/.local/codex/node_modules/.bin/codex.cmd"
          else
            export TRAE2CODEX_TEST_CODEX="$GITHUB_WORKSPACE/.local/codex/node_modules/.bin/codex"
          fi
          python -m unittest discover -s tests -v

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: trae2codex-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [unit, codex-integration, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: trae2codex-distributions
          path: dist
      - name: Verify tag and package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          from trae2codex import __version__

          project_version = tomllib.loads(
              Path("pyproject.toml").read_text(encoding="utf-8")
          )["project"]["version"]
          if project_version != __version__:
              raise SystemExit(
                  f"Version mismatch: pyproject={project_version}, package={__version__}"
              )
          expected_tag = f"v{project_version}"
          actual_tag = os.environ["RELEASE_TAG"]
          if actual_tag != expected_tag:
              raise SystemExit(f"Tag must be {expected_tag}, got {actual_tag}")

          expected_files = {
              f"trae2codex-{project_version}-py3-none-any.whl",
              f"trae2codex-{project_version}.tar.gz",
          }
          actual_files = {path.name for path in Path("dist").iterdir() if path.is_file()}
          if actual_files != expected_files:
              raise SystemExit(
                  f"Unexpected release files: expected {expected_files}, got {actual_files}"
              )
          PY
      - name: Generate checksums
        working-directory: dist
        run: sha256sum *.whl *.tar.gz > SHA256SUMS
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/*.whl \
            dist/*.tar.gz \
            dist/SHA256SUMS \
            --verify-tag \
            --generate-notes \
            --title "trae2codex $GITHUB_REF_NAME"
